<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C264D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="德化廟務">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>德化廟務</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1C264D;--gold:#F7CC71;--gray:#E6E6E6;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC",sans-serif;background:var(--gray);color:var(--navy);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--navy);color:var(--white);padding:calc(20px + env(safe-area-inset-top)) 20px 16px}
  header .who{font-size:22px;font-weight:700;min-height:32px}
  header .date{font-size:14px;opacity:.8;margin-top:2px}
  nav{display:flex;background:var(--navy)}
  nav button{flex:1;padding:12px 2px;white-space:nowrap;letter-spacing:-.3px;border:0;background:none;color:#fff;opacity:.6;font:inherit;font-size:16px;border-bottom:3px solid transparent}
  nav button.on{opacity:1;border-color:var(--gold);font-weight:700}
  #app{flex:1}
  main{padding:20px;max-width:480px;width:100%;margin:0 auto}
  .card{background:var(--white);border-radius:12px;padding:20px;margin-bottom:16px}
  .status{display:flex;gap:12px}
  .status div{flex:1;text-align:center}
  .status small{display:block;font-size:13px;opacity:.6}
  .status b{font-size:24px}
  .big{display:block;width:100%;padding:22px;border:0;border-radius:12px;font:inherit;font-size:22px;font-weight:700;margin-bottom:12px;cursor:pointer}
  .in{background:var(--navy);color:var(--white)}
  .out{background:var(--white);color:var(--navy);border:2px solid var(--navy)}
  .big:disabled{opacity:.5}
  label{display:block;font-size:14px;margin:0 0 6px;font-weight:700}
  input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #c9c9c9;border-radius:8px;margin-bottom:16px;color:var(--navy);background:#fff}
  textarea{min-height:160px;resize:vertical}
  .send{background:var(--gold);color:var(--navy)}
  .msg{min-height:24px;text-align:center;font-size:15px;margin-top:4px}
  .msg.ok{color:#2e7d32}.msg.err{color:#c62828}
  .hide{display:none!important}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .ph{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;background:var(--gray)}
  .ph img{width:100%;height:100%;object-fit:cover}
  .ph button{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(28,38,77,.85);color:#fff;font-size:16px;line-height:26px}
  .add{width:88px;height:88px;border:2px dashed #b5b5b5;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#777;text-align:center;cursor:pointer}
  .day{margin-bottom:14px}
  .day h3{font-size:15px;margin-bottom:6px}
  .day h3 small{font-weight:400;opacity:.6;margin-left:6px}
  .shift{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:#f5f5f5;margin-bottom:6px;font-size:15px}
  .shift.me{background:var(--gold);font-weight:700}
  .shift .note{display:block;font-size:12px;font-weight:400;opacity:.75}
  .empty{text-align:center;opacity:.6;padding:12px 0}
  .sched{padding:8px 12px}
  .mon{font-weight:700;font-size:15px;padding:12px 4px 6px;border-bottom:2px solid var(--gold)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee}
  .row.wk .dt b{color:#a33}
  .dt{width:48px;text-align:center;flex:none}
  .dt b{display:block;font-size:16px}
  .dt small{font-size:12px;opacity:.6}
  .ppl{flex:1;display:flex;flex-wrap:wrap;gap:4px}
  .ppl .who{background:#f0f0f0;border-radius:12px;padding:3px 10px;font-size:14px}
  .ppl .who.me{background:var(--gold);font-weight:700}
  .ppl .gap{color:#c62828;font-weight:700;font-size:14px}
  .ppl .none{opacity:.4;font-size:14px}
  .op{flex:none;border:0;border-radius:16px;padding:6px 12px;font:inherit;font-size:14px;background:var(--navy);color:#fff}
  .op.cancel{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .op:disabled{opacity:.5}
  .seg{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-size:16px;color:var(--navy)}
  .seg button.on{background:var(--navy);color:#fff;font-weight:700}
  .sub{font-weight:400;opacity:.6;margin-left:6px}
  .srow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .srow .n{width:20px;font-size:13px;opacity:.5;text-align:right;flex:none}
  .srow select{width:38%;margin:0;padding:10px 6px}
  .srow input{flex:1;margin:0;padding:10px}
  #btnStay{margin-top:8px}
  #admin{flex:1}
  .adnav button{font-size:15px;padding:12px 4px}
  .ah{font-size:16px;margin-bottom:12px}
  .prow{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
  .prow.off{opacity:.5}
  .pn{display:flex;justify-content:space-between;align-items:baseline}
  .pn span{font-size:14px;opacity:.7}
  .pb{display:flex;gap:6px;flex-wrap:wrap}
  .sb{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:16px;padding:6px 12px;font:inherit;font-size:14px}
  .sb.pri{background:var(--navy);color:#fff}
  .sb.warn{background:#c62828;border-color:#c62828;color:#fff}
  .lrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px}
  .lrow span:first-of-type{flex:1}
  .lrow small{opacity:.6;font-size:12px}
  .ok{color:#2e7d32;font-size:13px}.bad{color:#c62828;font-size:13px}.mid{color:#b26a00;font-size:13px}
  .empty.gap{color:#c62828;opacity:1}
  .who .x{margin-left:4px;color:#c62828;font-weight:700;cursor:pointer}
  .sform{background:#f7f7f7;border-radius:10px;padding:12px;margin:4px 0 10px}
  .sform input,.sform select{margin-bottom:8px}
  .sform small,.card small{display:block;font-size:12px;opacity:.6;margin-top:6px}
  .srow2{display:flex;gap:6px}.srow2 input,.srow2 select{flex:1;min-width:0}
  .rep{padding:10px 0;border-bottom:1px solid #eee}
  .rep small{display:inline;margin-left:6px}
  .rep p{margin:6px 0;font-size:15px;white-space:pre-wrap}
  .kind{font-size:12px;background:#eee;border-radius:10px;padding:2px 8px}.kind.bad{background:#fde3e3}
  .pl a{margin-right:12px;font-size:14px;color:var(--navy)}
  small.note{margin:-10px 0 14px}
  footer{text-align:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  footer img{width:32px;height:auto}
  .invalid{padding:60px 20px;text-align:center;font-size:18px;flex:1}
  .invalid small{display:block;margin-top:8px;font-size:14px;opacity:.7}
  .login{flex:1;padding:60px 20px 20px;max-width:480px;width:100%;margin:0 auto}
  .login h2{font-size:22px;text-align:center;margin-bottom:24px}
  .login input{font-size:28px;letter-spacing:12px;text-align:center}
  .login input::placeholder{letter-spacing:2px;font-size:18px}
  .login small{display:block;text-align:center;font-size:13px;opacity:.6;margin-top:12px}
  .push p{font-size:15px;margin-bottom:12px;line-height:1.6}
  .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#c62828;color:#fff;font-size:11px;font-style:normal;margin-left:4px;vertical-align:2px}
  .rep.new b::before{content:'● ';color:#c62828}
  #toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;font-size:15px;white-space:pre-wrap;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateY(-150%);transition:transform .3s;z-index:9;border-left:5px solid var(--gold)}
  #toast.on{transform:none}
  #app nav button{font-size:15px}
  .switch+.switch{margin-right:6px}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
  #lightbox img{max-width:100%;max-height:85vh;border-radius:6px}
  #lbMsg{color:#fff;margin-top:12px;font-size:14px;opacity:.8}
  .pl .sb{margin:4px 6px 0 0}
  .pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .th{width:96px;height:96px;object-fit:cover;border-radius:6px;display:inline-block;cursor:pointer;background:#e6e6e6}
  .th.ld{animation:thp 1.2s ease-in-out infinite}
  @keyframes thp{50%{opacity:.5}}
  .rsel{width:auto;margin:0;padding:5px 8px;border-radius:16px;font-size:14px;border:1px solid var(--navy)}
  .role{font-size:12px;background:var(--gold);color:var(--navy);border-radius:10px;padding:1px 8px;margin-left:6px;font-weight:700}
  .switch{float:right;margin-top:4px;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:14px;padding:3px 10px;font:inherit;font-size:12px;font-weight:400}
</style>
</head>
<body>

<div id="invalid" class="invalid hide"><span id="invalidText">系統尚未設定完成</span><small>請聯絡管理者</small></div>

<div id="login" class="login hide">
  <div class="card">
    <h2>德化廟務</h2>
    <label for="pin">請輸入個人 PIN 碼</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 位數字">
    <button class="big in" id="btnLogin" onclick="login()">進入</button>
    <div class="msg" id="mLogin"></div>
    <small>第一次輸入後，這支手機會記住你，之後不用再輸入</small>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="who"><span id="who">載入中…</span><button class="switch" onclick="logout()">切換使用者</button><button class="switch" onclick="refresh(true)" aria-label="重新整理">↻</button></div>
    <div class="date" id="today"></div>
  </header>
  <nav>
    <button id="tab-clock" class="on" onclick="tab('clock')">簽到/簽退</button>
    <button id="tab-report" onclick="tab('report')">回報</button>
    <button id="tab-schedule" onclick="tab('schedule')">班表</button>
    <button id="tab-news" onclick="tab('news')">公告</button>
    <button id="tab-lead" class="hide" onclick="tab('lead')">管理</button>
  </nav>
  <main>
    <section id="clock">
      <div id="pushStaff"></div>
      <div class="card status">
        <div><small>簽到</small><b id="sIn">—</b></div>
        <div><small>簽退</small><b id="sOut">—</b></div>
      </div>
      <button class="big in" id="btnIn" onclick="clock('簽到')">簽到</button>
      <button class="big out" id="btnOut" onclick="clock('簽退')">簽退</button>
      <div class="msg" id="mClock"></div>
    </section>

    <section id="report" class="hide">
      <div class="seg"><button id="seg-work" class="on" onclick="seg('work')">事務回報</button><button id="seg-stay" onclick="seg('stay')">住廟回報</button></div>
      <div class="card" id="rStay" style="display:none">
        <label>今天住廟人員<span class="sub" id="stayDate"></span></label>
        <div id="stayRows"></div>
        <button class="big send" id="btnStay" onclick="sendStay()">送出住廟回報</button>
        <div class="msg" id="mStay"></div>
      </div>
      <div class="card" id="rWork">
        <label for="rKind">類型</label>
        <select id="rKind"><option>日報</option><option>異常回報</option><option>其他</option></select>
        <label for="rDate">日期</label>
        <input type="date" id="rDate">
        <label for="rText">內容</label>
        <textarea id="rText" placeholder="完成的事項、待辦、需要注意的情況…"></textarea>
        <label>照片（最多 3 張，可不附）</label>
        <div class="photos" id="photos"></div>
        <input type="file" id="pick" accept="image/*" multiple class="hide">
        <button class="big send" id="btnSend" onclick="send()">送出</button>
        <div class="msg" id="mReport"></div>
      </div>
    </section>

    <section id="news" class="hide">
      <div class="card" id="newsList"><div class="empty">載入中…</div></div>
    </section>

    <section id="lead" class="hide">
      <div class="seg"><button id="lg-today" class="on" onclick="leadGo('today')">今日</button><button id="lg-sched" onclick="leadGo('sched')">排班</button><button id="lg-log" onclick="leadGo('log')">紀錄</button></div>
      <div class="msg" id="leadMsg"></div>
      <div id="leadBody"><div class="empty">載入中…</div></div>
    </section>

    <section id="schedule" class="hide">
      <div class="msg" id="mSched"></div>
      <div class="card sched" id="schedList"><div class="empty">載入中…</div></div>
    </section>
  </main>
</div>

<div id="admin" class="hide">
  <header>
    <div class="who"><span id="adWho">管理者</span><button class="switch" onclick="logout()">切換使用者</button><button class="switch" onclick="refresh(true)" aria-label="重新整理">↻</button></div>
    <div class="date" id="adToday"></div>
  </header>
  <nav class="adnav">
    <button id="at-people" class="on" onclick="adTabGo('people')">人員</button>
    <button id="at-today" onclick="adTabGo('today')">今日</button>
    <button id="at-sched" onclick="adTabGo('sched')">排班</button>
    <button id="at-log" onclick="adTabGo('log')">紀錄</button>
    <button id="at-news" onclick="adTabGo('news')">公告</button>
    <button id="at-settings" onclick="adTabGo('settings')">設定</button>
  </nav>
  <main><div class="msg" id="adMsg"></div><div id="adBody"><div class="empty">載入中…</div></div></main>
</div>

<div id="toast"></div>
<div id="lightbox" class="hide" onclick="closePhoto()"><img id="lbImg" alt=""><div id="lbMsg"></div></div>
<footer><img alt="德化" src="logo-mark.png"></footer>

<script src="app.js?v=13"></script>
<script src="admin.js?v=8"></script>
<script src="push.js?v=3"></script>
</body>
</html>
